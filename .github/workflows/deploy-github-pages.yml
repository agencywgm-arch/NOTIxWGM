name: Deploy to GitHub Pages (optionnel)

# ⚠️ NON UTILISÉ PAR DÉFAUT.
#
# Le déploiement de Noti Calling passe par Cloudflare Pages (voir README) :
# GitHub Pages ne fonctionne pas sur un dépôt privé en plan gratuit.
#
# Ce workflow reste ici au cas où le dépôt passerait en public. Il ne se
# déclenche QUE manuellement (Actions → ce workflow → « Run workflow »), pour
# ne pas échouer bruyamment à chaque push.
#
# Avant de l'utiliser : Settings → Pages → Source : GitHub Actions, et créer les
# secrets VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_VAPID_PUBLIC_KEY.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # Pages « projet » => /<repo>/ ; Pages « user/org » => mettre "/"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: SPA fallback (liens profonds /s/{scan_point_id})
        run: cp dist/index.html dist/404.html

      - name: No Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
