name: CI — build

# Vérifie que l'application compile. Le déploiement lui-même est assuré par
# Cloudflare Pages, qui construit directement depuis le dépôt (voir README).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Valeurs factices : on valide la compilation, pas la configuration.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_BASE_PATH: /
        run: npm run build
