<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F1E9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Noti Calling — commandez, retirez au bar." />
    <title>Noti Calling</title>

    <!-- Charte typographique (feuille de route §11) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Great+Vibes&family=Oswald:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f7f1e9;
        color: #1c2a4a;
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea,
      select,
      button {
        font-family: inherit;
        font-size: 16px; /* évite le zoom automatique iOS */
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2c8b8;
        border-radius: 3px;
      }

      /* ====================================================================
         ESPACE ÉQUIPE — direction Wegemo
         --------------------------------------------------------------------
         Le parcours CLIENT garde la charte (crème, terracotta, Playfair) :
         il ne redéfinit aucune de ces variables, donc les valeurs de repli
         inscrites dans theme.js s'appliquent telles quelles.

         Ici on ne retouche AUCUN composant : on redéfinit la palette sur le
         conteneur de l'espace équipe, et tout ce qu'il contient suit — y
         compris les composants partagés avec le client (feuilles modales,
         champs, bandeaux), qu'il aurait sinon fallu dupliquer.

         Repris du design system Wegemo (autre outil de back-office) : fond
         gris clair, surfaces blanches, bordures noires quasi-transparentes
         plutôt que des gris pleins, une seule famille de police (la
         hiérarchie se fait par poids et taille, jamais par changement de
         police), et des accents saturés façon iOS — chaque statut de
         commande a sa propre couleur au lieu de tout aplatir en noir/gris.
         ==================================================================== */
      .noti-staff {
        /* Fonds : gris clair pour la page, blanc pur pour les cartes */
        --n-cream: #f5f5f7;
        --n-creamSoft: #fafafa;
        --n-paper: #ffffff;

        /* Accent principal → bleu iOS, réservé aux actions/statuts en cours. */
        --n-terracotta: #0071e3;
        --n-terracottaSoft: #cfe5fb;
        --n-navy: #1d1d1f;
        --n-indigo: #bf5af2;

        /* Le dégradé signature n'a pas sa place ici : aplat neutre. */
        --n-gradient: #f5f5f7;
        --n-rose: #f5f5f7;
        --n-peach: #f5f5f7;

        /* États. Vert « réglé », rouge « impayé / incident / annulation »,
           orange pour ce qui attend une action. Chaque teinte porte un sens
           précis, jamais décorative. */
        --n-ok: #34c759;
        --n-danger: #ff375f;
        --n-warn: #ff9f0a;
        /* Distinct du violet (info/VIP) et de l'orange (en attente) : l'ambre
           reste la seule couleur qui dit « offert / crédité », comme côté
           client. */
        --n-gold: #c9a24b;
        --n-goldDark: #8a6a20;

        /* Texte : encre Apple, gris pour le secondaire et le tertiaire */
        --n-text: #1d1d1f;
        --n-dim: #6e6e73;
        --n-faint: #aeaeb2;

        /* Bordures : du noir en transparence, jamais un gris opaque */
        --n-line: rgba(0, 0, 0, 0.08);
        --n-lineHi: rgba(0, 0, 0, 0.14);

        /* Typographie : une seule famille pour tout le staff */
        --n-fontDisplay: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --n-fontScript: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --n-fontLabel: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --n-fontBody: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

        /* Angles généreux, façon Wegemo : Surface 18px, contrôles 12px */
        --n-radiusCard: 18px;
        --n-radiusControl: 12px;

        letter-spacing: normal;
      }

      /* Les libellés en capitales espacées (Oswald) perdent leur raison
         d'être en Figtree ; on neutralise l'espacement hérité. */
      .noti-staff [style*='uppercase'] {
        letter-spacing: 0.02em;
      }

      .noti-staff ::-webkit-scrollbar-thumb {
        background: #d2d2d7;
      }
      #boot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Great Vibes', cursive;
        font-size: 34px;
        color: #6a5fd6;
      }
      @media print {
        body { background: #fff; }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Calling</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
