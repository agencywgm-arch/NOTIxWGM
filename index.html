<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F1E9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Noti Calling — commandez, retirez au bar." />
    <title>Noti Calling</title>

    <!-- Charte typographique (feuille de route §11) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Great+Vibes&family=Oswald:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f7f1e9;
        color: #1c2a4a;
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea,
      select,
      button {
        font-family: inherit;
        font-size: 16px; /* évite le zoom automatique iOS */
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2c8b8;
        border-radius: 3px;
      }
      #boot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Great Vibes', cursive;
        font-size: 34px;
        color: #6a5fd6;
      }
      @media print {
        body { background: #fff; }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Calling</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
