<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F1E9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Noti Calling — commandez, retirez au bar." />
    <title>Noti Calling</title>

    <!-- Charte typographique (feuille de route §11) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Great+Vibes&family=Oswald:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f7f1e9;
        color: #1c2a4a;
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea,
      select,
      button {
        font-family: inherit;
        font-size: 16px; /* évite le zoom automatique iOS */
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2c8b8;
        border-radius: 3px;
      }

      /* ====================================================================
         ESPACE ÉQUIPE — noir et blanc épuré, façon Wegemo
         --------------------------------------------------------------------
         Le parcours CLIENT garde la charte (crème, terracotta, Playfair) :
         il ne redéfinit aucune de ces variables, donc les valeurs de repli
         inscrites dans theme.js s'appliquent telles quelles.

         Ici on ne retouche AUCUN composant : on redéfinit la palette sur le
         conteneur de l'espace équipe, et tout ce qu'il contient suit — y
         compris les composants partagés avec le client (feuilles modales,
         champs, bandeaux), qu'il aurait sinon fallu dupliquer.

         Vu sur les vraies captures de Wegemo (pas le document de blueprint,
         qui listait une palette bien plus saturée que ce qui est réellement
         à l'écran) : fond gris clair, cartes blanches, texte noir/gris —
         la couleur n'apparaît quasiment jamais sur le CHROME (fond de carte,
         bordure, bouton). Elle est réservée à deux choses : un signal
         argent/risque ponctuel (vert « réglé », rouge « impayé »), et de
         petits badges pastel derrière une icône. Les boutons, eux, sont
         strictement noir sur blanc ou blanc sur noir.
         ==================================================================== */
      .noti-staff {
        /* Fonds : gris clair pour la page, blanc pur pour les cartes */
        --n-cream: #f2f2f2;
        --n-creamSoft: #f0f0f2;
        --n-paper: #ffffff;

        /* Accent principal → noir. Pas de bleu, pas de violet : un seul
           accent, comme sur les captures. */
        --n-terracotta: #000000;
        --n-terracottaSoft: #e5e5ea;
        --n-navy: #000000;
        --n-indigo: #1c1c1e;

        /* Le dégradé signature n'a pas sa place ici : aplat neutre. */
        --n-gradient: #f2f2f2;
        --n-rose: #f2f2f2;
        --n-peach: #f2f2f2;

        /* États. Deux couleurs seulement, et elles portent de l'argent ou un
           risque : vert « réglé », rouge « impayé / incident / annulation ».
           Tout le reste — y compris les étapes du service (reçue, en prépa,
           prête) et le badge « offert » — reste en valeurs de gris : c'est
           écrit en toutes lettres sur le cadran, la couleur n'y ajoute rien. */
        --n-ok: #34c759;
        --n-danger: #ff3b30;
        --n-warn: #636366;
        --n-gold: #8e8e93;
        --n-goldDark: #3a3a3c;

        /* Texte : noir franc, gris pour le secondaire et le tertiaire */
        --n-text: #000000;
        --n-dim: #6e6e73;
        --n-faint: #aeaeb2;

        /* Bordures : du noir en transparence, jamais un gris opaque */
        --n-line: rgba(0, 0, 0, 0.07);
        --n-lineHi: rgba(0, 0, 0, 0.14);

        /* Typographie : une seule famille pour tout le staff */
        --n-fontDisplay: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --n-fontScript: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --n-fontLabel: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --n-fontBody: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

        /* Angles généreux, façon Wegemo : cartes 20px, contrôles 16px */
        --n-radiusCard: 20px;
        --n-radiusControl: 16px;

        letter-spacing: normal;
      }

      /* Les libellés en capitales espacées (Oswald) perdent leur raison
         d'être en Figtree ; on neutralise l'espacement hérité. */
      .noti-staff [style*='uppercase'] {
        letter-spacing: 0.02em;
      }

      .noti-staff ::-webkit-scrollbar-thumb {
        background: #d2d2d7;
      }
      #boot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Great Vibes', cursive;
        font-size: 34px;
        color: #6a5fd6;
      }
      @media print {
        body { background: #fff; }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Calling</div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
